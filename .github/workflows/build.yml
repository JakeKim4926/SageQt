name: build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.11.2
  AQT_SOURCE: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            qt-host: windows
            qt-arch: win64_msvc2022_64
            preset: windows-x64-debug
          - os: windows-2025
            qt-host: windows
            qt-arch: win64_msvc2022_64
            preset: windows-x64-release
          - os: macos-15
            qt-host: mac
            qt-arch: clang_64
            preset: macos-arm64-debug
          - os: macos-15
            qt-host: mac
            qt-arch: clang_64
            preset: macos-arm64-release
          - os: ubuntu-24.04
            qt-host: linux
            qt-arch: linux_gcc_64
            preset: linux-x64-debug
          - os: ubuntu-24.04
            qt-host: linux
            qt-arch: linux_gcc_64
            preset: linux-x64-release

    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Qt (jurplel/install-qt-action v4.4.1, aqtinstall main 076e165 for the Qt 6.11 Windows layout)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt-host }}
          target: desktop
          arch: ${{ matrix.qt-arch }}
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true

      - name: Set up MSVC (ilammy/msvc-dev-cmd v1.13.0)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      - name: Configure
        env:
          QTDIR: ${{ env.QT_ROOT_DIR }}
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Check app metadata
        shell: bash
        run: |
          expected=$(sed -nE 's/^project\(SageQt VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          dir=out/build/${{ matrix.preset }}/SageQt
          case "$RUNNER_OS" in
            Windows)
              actual=$(pwsh -NoProfile -Command "(Get-Item '$dir/SageQt.exe').VersionInfo.ProductVersion" | tr -d '\r')
              licenses=$dir/licenses
              ;;
            macOS)
              plist=$dir/SageQt.app/Contents/Info.plist
              actual=$(plutil -extract CFBundleShortVersionString raw "$plist")
              echo "bundle identifier: $(plutil -extract CFBundleIdentifier raw "$plist")"
              test "$(plutil -extract CFBundleIdentifier raw "$plist")" = "com.sage.sageqt"
              licenses=$dir/SageQt.app/Contents/Resources/licenses
              test "$(plutil -extract CFBundleIconFile raw "$plist")" = "sageqt.icns"
              test -f "$dir/SageQt.app/Contents/Resources/sageqt.icns"
              ;;
            Linux)
              actual=$(sed -n 's/^X-AppVersion=//p' "$dir/SageQt.desktop")
              grep -qx 'Icon=sageqt' "$dir/SageQt.desktop"
              licenses=$dir/licenses
              ;;
          esac
          echo "expected version: $expected, actual: $actual"
          test -n "$expected"
          test "$actual" = "$expected"
          ls "$licenses"
          test -f "$licenses/PretendardLicense.txt"
          test -f "$licenses/GmarketSansLicense.txt"

      - name: Package
        if: endsWith(matrix.preset, '-release')
        shell: bash
        run: |
          cmake --install out/build/${{ matrix.preset }} --prefix "$GITHUB_WORKSPACE/out/stage/${{ matrix.preset }}"
          cd out/build/${{ matrix.preset }}
          cpack -B "$GITHUB_WORKSPACE/out/package"
          ls -la "$GITHUB_WORKSPACE/out/package"

      - name: Upload package (actions/upload-artifact v7.0.1)
        if: endsWith(matrix.preset, '-release')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-${{ matrix.preset }}
          path: |
            out/package/SageQt-*.zip
            out/package/SageQt-*.dmg
            out/package/SageQt-*.tar.gz
            out/package/SageQt-*.sha256
          if-no-files-found: error

  verify-package:
    name: verify-${{ matrix.preset }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            preset: windows-x64-release
          - os: macos-15
            preset: macos-arm64-release
          - os: ubuntu-24.04
            preset: linux-x64-release

    steps:
      - name: Download package (actions/download-artifact v8.0.1)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: package-${{ matrix.preset }}
          path: package

      - name: Install Linux system libraries (the tar.gz relies on these, not bundled)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libopengl0 libegl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Run package without Qt
        shell: bash
        run: |
          set -u
          ls -la package
          (cd package && for checksum in *.sha256; do echo "checksum file: $checksum"; cat "$checksum"; done)
          if command -v qmake6 >/dev/null 2>&1 || command -v qtpaths6 >/dev/null 2>&1; then
            echo "Qt found on this runner"
            exit 1
          fi
          mkdir -p app
          launcher=""
          case "$RUNNER_OS" in
            Windows)
              unzip -q package/SageQt-*.zip -d app
              exe=$(find app -name SageQt.exe | head -n 1)
              data_dir="$APPDATA/Sage/SageQt"
              ;;
            macOS)
              hdiutil attach package/SageQt-*.dmg -mountpoint /Volumes/SageQtPackage -nobrowse -quiet
              cp -R /Volumes/SageQtPackage/SageQt.app app/
              hdiutil detach /Volumes/SageQtPackage -quiet
              exe=app/SageQt.app/Contents/MacOS/SageQt
              data_dir="$HOME/Library/Application Support/Sage/SageQt"
              ;;
            Linux)
              tar -xzf package/SageQt-*.tar.gz -C app
              exe=$(find app -path '*/bin/SageQt' -type f | head -n 1)
              data_dir="$HOME/.local/share/Sage/SageQt"
              launcher="xvfb-run -a"
              ;;
          esac
          echo "executable: $exe"
          test -n "$exe"
          rm -rf "$data_dir"
          $launcher "$exe" > app-log.txt 2>&1 &
          app_pid=$!
          sleep 20
          alive=0
          if kill -0 "$app_pid" 2>/dev/null; then
            alive=1
            kill "$app_pid" || true
          fi
          echo "--- app log"
          cat app-log.txt || true
          echo "--- data directory"
          ls -la "$data_dir" || true
          test "$alive" = 1
          test -f "$data_dir/sageqt.db"

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Qt (jurplel/install-qt-action v4.4.1, aqtinstall main 076e165 for the Qt 6.11 Windows layout)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true

      - name: Install analysis tools (clang-format 22.1.3 from PyPI, clang-tidy 22 from apt.llvm.org)
        run: |
          pip install clang-format==22.1.3
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main"
          sudo apt-get update
          sudo apt-get install -y clang-22 clang-tidy-22 llvm-22-dev libclang-22-dev libclang-cpp22-dev
          clang-format --version
          clang-tidy-22 --version

      - name: Build clazy (v1.17.1 55a7af4 against LLVM 22)
        run: |
          git clone --quiet https://github.com/KDE/clazy.git "$RUNNER_TEMP/clazy"
          git -C "$RUNNER_TEMP/clazy" checkout --quiet 55a7af428ea793c5b88962eafb8a59f9f5a78d9a
          cmake -S "$RUNNER_TEMP/clazy" -B "$RUNNER_TEMP/clazy-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++-22 -DLLVM_ROOT=/usr/lib/llvm-22 -DCLAZY_LINK_CLANG_DYLIB=ON
          cmake --build "$RUNNER_TEMP/clazy-build"
          echo "$RUNNER_TEMP/clazy-build/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/clazy-build/bin/clazy-standalone" --version

      - name: Configure
        env:
          QTDIR: ${{ env.QT_ROOT_DIR }}
        run: cmake --preset linux-x64-debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DSAGE_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build --preset linux-x64-debug

      - name: Check format
        run: clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.h')

      - name: Run clang-tidy
        run: clang-tidy-22 -p out/build/linux-x64-debug $(git ls-files '*.cpp')

      - name: Run clazy
        run: >
          clazy-standalone -p out/build/linux-x64-debug
          -checks=level1,missing-qobject-macro,old-style-connect,no-non-pod-global-static
          --extra-arg=-Werror
          --extra-arg=-resource-dir=$(clang-22 -print-resource-dir)
          $(git ls-files '*.cpp')

      - name: Check platform branches
        run: |
          if git grep -nE 'Q_OS_|_WIN32|__APPLE__|__linux__|<windows\.h>' -- '*.cpp' '*.h'; then
            exit 1
          fi

      - name: Check auto keyword
        run: |
          if git grep -nwE 'auto' -- '*.cpp' '*.h'; then
            exit 1
          fi

      - name: Check comments
        run: |
          if git grep -nE '(^|[^:])//|/\*' -- '*.cpp' '*.h'; then
            exit 1
          fi
